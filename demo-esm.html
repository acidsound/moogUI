<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoogKnob ES Module Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #141518;
      color: #eee9de;
      font-family: Inter, system-ui, sans-serif;
    }
    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      padding: 36px 44px;
      background: linear-gradient(160deg, #1b1c20, #0f1013);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>
<body>
  <div class="panel">
    <moog-knob
      id="tune"
      label="OSCILLATOR TUNE"
      min="-5"
      max="5"
      value="0"
      step="0.05"
      bipolar
      scale-labels="-5,-3,-1,0,+1,+3,+5"
      unit="st"
      size="lg"
    ></moog-knob>

    <moog-knob
      id="cutoff"
      label="CUTOFF FREQUENCY"
      min="0"
      max="10"
      value="6"
      scale-labels="0,2,4,6,8,10"
      size="lg"
    ></moog-knob>

    <moog-knob
      id="range"
      label="RANGE"
      detents
      variant="pointer"
      scale-labels="LO,32',16',8',4',2'"
      value="2"
      size="md"
    ></moog-knob>

    <moog-knob
      id="lfo"
      label="LFO RATE"
      variant="skirtless"
      min="0.1"
      max="15"
      value="4.2"
      unit="Hz"
      size="md"
    ></moog-knob>
  </div>

  <script type="module">
    import { MoogKnob } from './moog-knob.js';

    const cutoff = document.getElementById('cutoff');
    cutoff.format = (v) => {
      const hz = 20 * Math.pow(600, v / 10);
      return hz >= 1000 ? `${(hz / 1000).toFixed(2)} kHz` : `${Math.round(hz)} Hz`;
    };
  </script>
</body>
</html>
