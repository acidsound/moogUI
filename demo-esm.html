<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moog UI Kit ES Module Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #141518;
      color: #eee9de;
      font-family: Inter, system-ui, sans-serif;
    }
    .panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 28px;
      padding: 36px 44px;
      background: linear-gradient(160deg, #1b1c20, #0f1013);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>
<body>
  <div class="panel">
    <moog-knob
      id="tune"
      label="OSCILLATOR TUNE"
      min="-5"
      max="5"
      value="0"
      step="0.05"
      bipolar
      scale-labels="-5,-3,-1,0,+1,+3,+5"
      unit="st"
      size="lg"
    ></moog-knob>

    <moog-knob
      id="range"
      label="RANGE"
      detents
      variant="pointer"
      scale-labels="LO,32',16',8',4',2'"
      value="2"
      size="lg"
    ></moog-knob>

    <moog-knob
      id="encoder"
      label="ENDLESS 360°"
      endless
      wrap
      min="0"
      max="360"
      step="1"
      value="45"
      unit="°"
      show-arc
      size="md"
    ></moog-knob>

    <moog-switch id="modSw" label="MODULATION" color="orange" checked></moog-switch>
    <moog-switch id="pwrSw" label="POWER" variant="toggle" checked></moog-switch>
    <moog-led id="statusLed" label="ACTIVE" color="amber" variant="jewel" on></moog-led>
  </div>

  <script type="module">
    import './moog-ui.js';

    const pwrSw = document.getElementById('pwrSw');
    const statusLed = document.getElementById('statusLed');
    pwrSw.addEventListener('change', (e) => {
      statusLed.on = e.detail.checked;
    });
  </script>
</body>
</html>
